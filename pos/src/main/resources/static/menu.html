<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS System</title>
  <link rel="stylesheet" href="css/menu.css" />
    <script src="scripts/script.js"></script>
</head>
<body class="menu page">

 
  <div class="menu-wrapper">
 
  
    <div class="menu-left">
 
     
      <div class="menu-logo-area">
        <div class="logo-icon">
            <img src="images/final-logo.png" width="120" height="120" alt="Unspoken Cafe Lounge Logo" class="logo-image" />
        </div>
      </div>
 
  
      <div class="menu-scroll-area">
        <div class="menu-grid" id="menuGrid">
 
          <div class="menu-card" onclick="addToOrder('Americano', 120)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Americano</span>
              <span class="menu-card-price">₱120</span>
            </div>
          </div>
          <div class="menu-card" onclick="addToOrder('Cafe Latte', 140)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Cafe Latte</span>
              <span class="menu-card-price">₱140</span>
            </div>
          </div>
          <div class="menu-card" onclick="addToOrder('Snow Cappuccino', 150)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Snow Cappuccino</span>
              <span class="menu-card-price">₱150</span>
            </div>
          </div>
 
          <div class="menu-card" onclick="addToOrder('Milky Chocolate', 130)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Milky Chocolate</span>
              <span class="menu-card-price">₱130</span>
            </div>
          </div>
          <div class="menu-card" onclick="addToOrder('Cara Milky', 130)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Cara Milky</span>
              <span class="menu-card-price">₱130</span>
            </div>
          </div>
          <div class="menu-card" onclick="addToOrder('Honey Ginger Tea', 120)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Honey Ginger Tea</span>
              <span class="menu-card-price">₱120</span>
            </div>
          </div>
 
          <div class="menu-card" onclick="addToOrder('Lemon', 120)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Lemon</span>
              <span class="menu-card-price">₱120</span>
            </div>
          </div>
          <div class="menu-card" onclick="addToOrder('Strawberry', 120)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Strawberry</span>
              <span class="menu-card-price">₱120</span>
            </div>
          </div>
          <div class="menu-card" onclick="addToOrder('Mango', 120)">
            <div class="menu-card-img"></div>
            <div class="menu-card-info">
              <span class="menu-card-name">Mango</span>
              <span class="menu-card-price">₱120</span>
            </div>
          </div>
 
        </div>
      </div>
    </div>
 
  
    <div class="menu-divider"></div>
 
    
    <div class="menu-right">
 
      <div class="order-panel-box">
        <div class="order-panel-header">Order List :</div>
        <div class="order-panel-body" id="orderList">
        
          <p class="empty-state" id="emptyMsg">No items added yet.</p>
        </div>
        <div class="order-panel-total">
          <span>Total order :</span>
          <span id="totalAmount">₱0</span>
        </div>
      </div>
 
      <div class="order-actions">
        <button class="action-btn" onclick="clearOrder()">Clear</button>
        <button class="action-btn" onclick="checkOut()">Check Out</button>
      </div>
      <div class="order-actions-back">
        <button class="action-btn-back" onclick="window.location.href='index.html'">Back to Home Page</button>
      </div>
 
    </div>
  </div>

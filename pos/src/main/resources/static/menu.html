<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS System</title>
  <link rel="stylesheet" href="css/menu.css" />
    <script src="js/menu.js"></script>
</head>
<body class="menu-page">

  <!-- ══ INGREDIENT DIALOG ══ -->
  <div class="dialog-overlay" id="dialogOverlay" onclick="closeDialog(event)">
    <div class="dialog-box" id="dialogBox">

      <div class="dialog-header">
        <div class="dialog-emoji" id="dialogEmoji"></div>
        <div class="dialog-title-group">
          <h2 class="dialog-item-name" id="dialogName">Espresso</h2>
          <span class="dialog-item-price" id="dialogPrice">₱80</span>
        </div>
        <button class="dialog-close" onclick="closeDialogBtn()">✕</button>
      </div>

      <div class="dialog-body">
        <div class="dialog-section-label"> Ingredient Breakdown</div>
        <div class="dialog-ingredients" id="dialogIngredients"></div>
        <div class="dialog-cost-row dialog-cost-subtotal">
          <span>Ingredient Cost</span>
          <span id="dialogIngredientTotal">₱0</span>
        </div>
        <div class="dialog-cost-row dialog-cost-labor">
          <span>Labor &amp; Overhead</span>
          <span id="dialogLabor">₱0</span>
        </div>
        <div class="dialog-cost-row dialog-cost-final">
          <span>Selling Price</span>
          <span id="dialogFinalPrice">₱0</span>
        </div>
      </div>

      <div class="dialog-footer">
        <button class="dialog-btn-cancel" onclick="closeDialogBtn()">Cancel</button>
        <button class="dialog-btn-add" id="dialogAddBtn" onclick="confirmAdd()">Add to Order</button>
      </div>

    </div>
  </div>

  <div class="menu-wrapper">

    <div class="menu-left">
      <div class="menu-logo-area">
        <div class="logo-icon">
            <img src="images/final-logo.png" width="120" height="120" alt="Unspoken Cafe Lounge Logo" class="logo-image" />
        </div>
      </div>

      <div class="menu-scroll-area">
        <div class="menu-grid" id="menuGrid">

          <div class="menu-card" onclick="openDialog('Americano', 120, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Americano</span><span class="menu-card-price">₱120</span></div>
          </div>
          <div class="menu-card" onclick="openDialog('Cafe Latte', 140, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Cafe Latte</span><span class="menu-card-price">₱140</span></div>
          </div>
          <div class="menu-card" onclick="openDialog('Snow Cappuccino', 150, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Snow Cappuccino</span><span class="menu-card-price">₱150</span></div>
          </div>

          <div class="menu-card" onclick="openDialog('Milkey Chocolate', 160, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Milkey Chocolate</span><span class="menu-card-price">₱160</span></div>
          </div>
          <div class="menu-card" onclick="openDialog('Cara Milky', 145, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Cara Milky</span><span class="menu-card-price">₱145</span></div>
          </div>
          <div class="menu-card" onclick="openDialog('Honey Ginger Tea', 130, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Honey Ginger Tea</span><span class="menu-card-price">₱130</span></div>
          </div>

          <div class="menu-card" onclick="openDialog('Lemon', 80, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Lemon</span><span class="menu-card-price">₱80</span></div>
          </div>
          <div class="menu-card" onclick="openDialog('Strawberry', 95, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Strawberry</span><span class="menu-card-price">₱95</span></div>
          </div>
          <div class="menu-card" onclick="openDialog('Mango', 100, '')">
            <div class="menu-card-img"></div>
            <div class="menu-card-info"><span class="menu-card-name">Mango</span><span class="menu-card-price">₱100</span></div>
          </div>

        </div>
      </div>
    </div>

    <div class="menu-divider"></div>

    <div class="menu-right">
      <div class="order-panel-box">
        <div class="order-panel-header">Order List :</div>
        <div class="order-panel-body" id="orderList">
          <p class="empty-state" id="emptyMsg">No items added yet.</p>
        </div>
        <div class="order-panel-total">
          <span>Total order :</span>
          <span id="totalAmount">₱0</span>
        </div>
      </div>
      <div class="order-actions">
        <button class="action-btn" onclick="clearOrder()">Clear</button>
        <button class="action-btn" id="CheckoutBtn" onclick="checkOut()">Check Out</button>
      </div>
      <div class="order-actions-back">
        <button class="action-btn-back" onclick="window.location.href='index.html'">Back to Home Page</button>
      </div>
    </div>

  </div>
</body>
</html>

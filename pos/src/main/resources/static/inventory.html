<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS System</title>
  <link rel="stylesheet" href="css/inventory.css" />
  <script src="js/inventory.js" defer></script>
</head>
<body>

  <div class="wrapper">

    <!-- Logo -->
    <div class="logo-area">
      <img src="images/final-logo.png" width="150" height="100" alt="Unspoken Cafe Lounge Logo" class="logo-image" />
    </div>

    <!-- Main content -->
    <div class="main">

      <!-- Left: Form -->
      <div class="form-section">
        <div class="field">
          <label>Product ID:</label>
          <input type="text" id="productId" placeholder="e.g. 101" />
        </div>
        <div class="field">
          <label>Product Name:</label>
          <input type="text" id="productName" placeholder="e.g. Coffee Beans" />
        </div>
        <div class="field">
          <label>Quantity:</label>
          <div class="qty-control">
            <button class="qty-btn" id="decreaseBtn">−</button>
            <span id="quantityDisplay">0</span>
            <button class="qty-btn" id="increaseBtn">+</button>
          </div>
        </div>
        <div class="field">
          <label>Date:</label>
          <input type="text" id="productDate" placeholder="MM/DD/YYYY" />
        </div>
      </div>

      <!-- Right: Action Buttons -->
      <div class="action-buttons">
        <button class="action-btn" id="addBtn" m>Add</button>
        <button class="action-btn" id="deleteBtn">Delete</button>
        <button class="action-btn" id="updateBtn">Update</button>
      </div>

    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table id="productTable">
        <thead>
          <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td>101</td>
            <td>Coffee Beans</td>
            <td>12</td>
            <td>05/08/2026</td>
          </tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>

    <!-- Home Button -->
    <div class="bottom-bar">
      <button class="home-btn" onclick="window.location.href='index.html'">Home</button>
    </div>

  </div>

</body>
</html>

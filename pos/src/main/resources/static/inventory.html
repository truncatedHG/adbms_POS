<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Page</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="css/inventory.css" />
</head>

<body>

  <div class="container">

    <!-- 🔥 TOP CENTER LOGO -->
    <div class="logo-center">
      <img src="images/final-logo.png" alt="Unspoken Cafe Lounge Logo">
    </div>

    <!-- Top Section -->
    <div class="top-section">

      <!-- Form Area -->
      <div class="form-area">

        <div class="form-group">
          <label>Product ID:</label>
          <input type="text" value="">
        </div>

        <div class="form-group">
          <label>Product name:</label>
          <input type="text" value="">
        </div>

        <div class="form-group">
          <label>Quantity:</label>
          <div class="quantity-box">
            <button type="button" class="qty-btn" onclick="decreaseQty()">−</button>
            <input type="number" id="quantity" class="qty-input" value="0" min="0">
            <button type="button" class="qty-btn" onclick="increaseQty()">+</button>
          </div>
        </div>

        <div class="form-group">
          <label>Date:</label>
          <input type="text" value="">
        </div>

      </div>

      <!-- Right Controls -->
      <div class="controls">

        <button class="btn">Add</button>
        <button class="btn">Delete</button>
        <button class="btn">Update</button>

      </div>

    </div>

    <!-- Table -->
    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>101</td>
            <td>Coffee Beans</td>
            <td>12</td>
            <td>05/08/2026</td>
          </tr>

          <tr>
            <td>&nbsp;</td>
            <td></td>
            <td></td>
            <td></td>
          </tr>

          <tr>
            <td>&nbsp;</td>
            <td></td>
            <td></td>
            <td></td>
          </tr>

        </tbody>

      </table>

    </div>

    <!-- Home Button -->
    <a href="index.html">
      <button class="home-btn">
        Back To Home Page
      </button>
    </a>

  </div>

  <script src="js/inventory.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"></html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS System</title>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

 
  <div class="left-panel">
    <div class="logo-area">
      <img src="images/final-logo.png" width="200" height="200" alt="Unspoken Cafe Lounge Logo" class="logo-image" />
    </div>
    <h1 class="welcome-heading">Welcome!</h1>
    <nav class="nav-buttons">
      <a class="nav-btn" id="PosBtn" href="menu.html">MENU</a>
      <a class="nav-btn" id="InventoryBtn" href="inventory.html">FULL INVENTORY HISTORY</a>
      <a class="nav-btn" href="history.html">FULL ORDER HISTORY</a>
    </nav>

  </div>
 
 <div class="right-panel">
  <div class="order-history-box">
    <div class="order-history-header">ORDER HISTORY</div>
    <div class="order-history-body" id="orderHistoryBody">
      
      <!-- Show this table only if there are orders -->
      <table class="history-table" th:if="${not #lists.isEmpty(orders)}">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Time</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="order : ${orders}">
            <td th:text="${'#' + order.id}">#101</td>
            <!-- Formats date to something readable like 14:30 -->
            <td th:text="${#temporals.format(order.orderDate, 'HH:mm')}">12:00</td>
            <td th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td>
          </tr>
        </tbody>
      </table>

      <!-- Show this only if the list is empty -->
      <p class="empty-state" th:if="${#lists.isEmpty(orders)}">No recent orders.</p>
      
    </div>
  </div>
</div>


<script>
  async function loadOrderHistory() {
    try {
        const response = await fetch('http://localhost:8080/pos/recent');
        const orders = await response.json();
        const container = document.getElementById('orderHistoryBody');

        if (orders.length === 0) {
            container.innerHTML = '<p class="empty-state">No recent orders.</p>';
            return;
        }

        // Build the table based on your Orders entity fields
        let tableHtml = `
            <table class="history-table" style="width:100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 2px solid #ddd;">
                        <th>Order Name</th>
                        <th>Date</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>`;

        orders.forEach(order => {
    // We check if order.product exists to avoid errors
    const productName = order.product ? order.product.productName : "Unknown Product";
    
    tableHtml += `
        <tr style="border-bottom: 1px solid #eee;">
            <td style="padding: 8px 0;">${productName}</td> <!-- Displays Product Name -->
            <td>${order.orderDate}</td>
            <td>${order.orderQuantity}</td>
            <td>₱${order.orderTotal.toLocaleString()}</td>
        </tr>`;
});

        tableHtml += '</tbody></table>';
        container.innerHTML = tableHtml;

    } catch (error) {
        console.error('Error fetching orders:', error);
        document.getElementById('orderHistoryBody').innerHTML = '<p>Failed to load orders.</p>';
    }
  }

  // Load orders when the page opens
  document.addEventListener('DOMContentLoaded', loadOrderHistory);
</script>
</body>
</html>
